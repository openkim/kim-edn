[build-system]
requires = ["setuptools>=80", "setuptools-scm>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "kim-edn"
authors = [{ name = "Yaser Afshar", email = "ya.afshar@gmail.com" }]
maintainers = [{ name = "Yaser Afshar", email = "ya.afshar@gmail.com" }]
description = "kim-edn - KIM-EDN encoder and decoder."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
keywords = [ "kim-edn", "edn" ]

[project.urls]
Homepage = "https://github.com/openkim/kim-edn"
Issues = "https://github.com/openkim/kim-edn/issues"

[tool.setuptools.packages.find]
include = [ "kim_edn*" ]

[tool.setuptools_scm]
version_file = "kim_edn/_version.py"
write_to_source = true
parentdir_prefix_version = "kim_edn-"

[tool.setuptools_scm.tag]
prefix = "v"
strict = true
